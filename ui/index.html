<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidequest</title>
<style>
  :root { --bg:#0b0d10; --card:#14181d; --ink:#e8eaed; --muted:#9aa3ad; --line:#242a31; --accent:#8bd3a6; --warn:#f2c76b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.45 -apple-system, "Inter", system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 80px; }
  h1 { font-size:28px; margin:8px 0 2px; letter-spacing:-0.01em; }
  .sub { color:var(--muted); margin:0 0 20px; }
  label { display:block; color:var(--muted); font-size:15px; margin:14px 0 6px; }
  textarea, select, input { width:100%; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font:inherit; }
  textarea { min-height:120px; resize:vertical; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  button { background:var(--accent); color:#06130b; border:0; border-radius:12px; padding:14px 18px; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin:12px 0; }
  .now { border-color:var(--accent); }
  .k { color:var(--muted); font-size:14px; text-transform:uppercase; letter-spacing:.08em; }
  .t { font-size:20px; font-weight:600; margin:4px 0; }
  .m { color:var(--muted); font-size:15px; }
  .why { color:var(--accent); font-size:15px; margin-top:6px; }
  .alt { color:var(--warn); font-size:14px; margin-top:6px; }
  .break { border-style:dashed; color:var(--muted); }
  .stats { color:var(--muted); font-size:14px; margin:6px 0 0; }
  .hidden { display:none; }
  .pill { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:2px 10px; font-size:13px; color:var(--muted); margin-right:6px; }
  .phone { background:#101a14; border-color:#1f4a31; }
  details summary { cursor:pointer; color:var(--muted); }
  pre { white-space:pre-wrap; background:#0f1317; border:1px solid var(--line); border-radius:12px; padding:12px; font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Sidequest</h1>
  <p class="sub">One day at KubeCon, sized for your brain.</p>

  <section id="ask">
    <label for="interests">What do you care about this week? Plain words, or paste the profile your AI wrote.</label>
    <textarea id="interests" placeholder="LLM inference on GPUs, edge AI, people building agents; I need breaks between talks"></textarea>
    <div class="row">
      <div style="flex:1">
        <label for="day">Day</label>
        <select id="day">
          <option value="2026-11-10" selected>Tuesday 10</option>
          <option value="2026-11-11">Wednesday 11</option>
          <option value="2026-11-12">Thursday 12</option>
          <option value="2026-11-09">Monday 9</option>
        </select>
      </div>
      <div style="flex:1">
        <label>&nbsp;</label>
        <button id="go" style="width:100%">Plan my day</button>
      </div>
    </div>
    <details style="margin-top:12px">
      <summary>Let your own AI write the profile (it already knows you)</summary>
      <p class="m">Copy this prompt into ChatGPT or Claude, paste the answer above.</p>
      <pre id="prompt">loading…</pre>
      <button class="ghost" id="copyPrompt">Copy prompt</button>
    </details>
  </section>

  <section id="plan" class="hidden">
    <div class="row" style="justify-content:space-between; margin-top:10px">
      <div><span class="k" id="dayName"></span><div class="stats" id="stats"></div></div>
      <div class="row">
        <button class="ghost" id="simplify">Too much. Simplify.</button>
        <button class="ghost" id="back">Change</button>
      </div>
    </div>
    <div id="nowNext"></div>
    <div id="items"></div>
    <h2 style="font-size:20px; margin-top:24px">Side events for you</h2>
    <div id="side"></div>
  </section>
</main>

<script>
// Real-user monitoring (Dash0 web SDK). The API hands out an ingest-only token when one is configured;
// without it this block does nothing, so a laptop run stays quiet.
fetch('/api/rum-config').then(r => r.json()).then(c => {
  if (!c.enabled) return;
  window.dash0 = window.dash0 || function () { (window.dash0.q = window.dash0.q || []).push(arguments); };
  dash0('init', { serviceName: 'sidequest-ui', endpoint: { url: c.url, authToken: c.token }, environment: c.environment });
  const s = document.createElement('script'); s.src = 'https://unpkg.com/@dash0/sdk-web/dist/dash0.iife.js'; s.defer = true; s.crossOrigin = 'anonymous';
  document.head.appendChild(s);
}).catch(() => {});

const $ = (s) => document.querySelector(s);
const state = { req: null, plan: null, simplify: false };

fetch('/api/prompt').then(r => r.json()).then(d => { $('#prompt').textContent = d.prompt; });
$('#copyPrompt').onclick = async () => { await navigator.clipboard.writeText($('#prompt').textContent); $('#copyPrompt').textContent = 'Copied'; };

function fmt(iso) { const d = new Date(iso); return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

async function plan() {
  const interests = $('#interests').value.trim();
  if (!interests) { $('#interests').focus(); return; }
  $('#go').disabled = true; $('#go').textContent = 'Planning…';
  state.req = { interests, day: $('#day').value, simplify: state.simplify, side_events: true };
  const r = await fetch('/api/plan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state.req) });
  $('#go').disabled = false; $('#go').textContent = 'Plan my day';
  if (!r.ok) { alert('The planner had a problem: ' + (await r.text())); return; }
  state.plan = await r.json();
  render();
}

function render() {
  const p = state.plan;
  $('#ask').classList.add('hidden'); $('#plan').classList.remove('hidden');
  $('#dayName').textContent = p.day_name;
  const s = p.stats;
  $('#stats').textContent = `${s.chosen} talks kept from ${s.talks_in_index} that day · ${s.clashes} clash${s.clashes === 1 ? '' : 'es'} flagged · built in ${s.seconds}s`;
  $('#simplify').textContent = state.simplify ? 'Show the full day' : 'Too much. Simplify.';

  const talks = p.items.filter(i => i.type === 'talk');
  const now = new Date();
  let idx = talks.findIndex(t => new Date(t.end) > now);
  if (idx < 0) idx = 0;
  const cur = talks[idx], nxt = talks[idx + 1];
  $('#nowNext').innerHTML = cur ? `
    <div class="card now"><div class="k">Next up</div><div class="t">${esc(cur.title)}</div>
      <div class="m">${fmt(cur.start)} to ${fmt(cur.end)} · ${esc(cur.room)}</div>
      ${nxt ? `<div class="m" style="margin-top:8px"><span class="k">Then</span> ${fmt(nxt.start)} · ${esc(nxt.title)}</div>` : ''}
    </div>` : '<div class="card">No talks matched for this day. Try other words.</div>';

  $('#items').innerHTML = p.items.map(i => i.type === 'break'
    ? `<div class="card break"><div class="k">${fmt(i.start)} to ${fmt(i.end)}</div><div class="t">Quiet break</div><div class="m">${esc(i.why)}</div></div>`
    : `<div class="card"><div class="k">${fmt(i.start)} to ${fmt(i.end)} · ${esc(i.track)}</div>
         <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${esc(i.title)}</a></div>
         <div class="m">${esc(i.room)}${i.speakers.length ? ' · ' + esc(i.speakers.slice(0, 2).join(', ')) : ''}</div>
         <div class="why">${esc(i.why)}</div>
         ${i.alternatives.length ? `<div class="alt">Clashes with ${esc(i.alternatives[0].title)} (${fmt(i.alternatives[0].start)}, ${esc(i.alternatives[0].room)}). This one scored higher.</div>` : ''}
       </div>`).join('');

  $('#side').innerHTML = (p.side_events || []).map(e => `
    <div class="card" id="side-${esc(e.id)}">
      <div class="k">${new Date(e.start).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' })}</div>
      <div class="t">${esc(e.title)}</div>
      <div class="m">${esc(e.location || '')}</div>
      <div class="why">${esc(e.why || '')}</div>
      <div class="row" style="margin-top:10px">
        <button class="ghost" onclick="registerOnPhone('${esc(e.id)}', ${JSON.stringify(e.title)}, ${JSON.stringify(e.url)})">Register from my phone</button>
        <a href="${esc(e.url)}" target="_blank" rel="noopener" class="m">Open on Luma</a>
      </div>
      <div class="m phoneStatus"></div>
    </div>`).join('') || '<div class="card m">No side events matched.</div>';
}

async function registerOnPhone(id, name, url) {
  const card = document.getElementById('side-' + id);
  const out = card.querySelector('.phoneStatus');
  card.classList.add('phone');
  out.textContent = 'Asking your phone…';
  const r = await fetch('/api/phone/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ event_name: name, event_url: url }) });
  if (!r.ok) { out.textContent = 'Phone agent not reachable. Use the Luma link instead.'; return; }
  const d = await r.json();
  out.textContent = d.message;
  const poll = async () => {
    const s = await (await fetch('/api/phone/status/' + encodeURIComponent(d.task_id))).json();
    out.textContent = `${s.state}${s.turn ? ' · step ' + s.turn : ''}${s.thought ? ' · ' + s.thought : ''}`;
    if (s.state === 'running' || s.state === 'unknown' || s.state === 'queued') setTimeout(poll, 3000);
    else if (s.state === 'completed') out.textContent = 'Stopped before the final button. Press it on your phone.';
  };
  setTimeout(poll, 3000);
}

$('#go').onclick = () => { state.simplify = false; plan(); };
$('#simplify').onclick = () => { state.simplify = !state.simplify; plan(); };
$('#back').onclick = () => { $('#plan').classList.add('hidden'); $('#ask').classList.remove('hidden'); };
</script>
</body>
</html>
