# Elasticsearch, single node, for the hackathon cluster. The password comes from the secret
# "sidequest-secrets" (key ES_PASSWORD), created out of band; never from this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  labels: { app: elasticsearch }
spec:
  replicas: 1
  selector: { matchLabels: { app: elasticsearch } }
  template:
    metadata: { labels: { app: elasticsearch } }
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
          ports: [{ containerPort: 9200, name: http }]
          env:
            - { name: discovery.type, value: single-node }
            - { name: xpack.security.enabled, value: "true" }
            - { name: xpack.security.http.ssl.enabled, value: "false" }
            - { name: xpack.ml.enabled, value: "false" }
            - { name: ES_JAVA_OPTS, value: "-Xms1g -Xmx1g" }
            - name: ELASTIC_PASSWORD
              valueFrom: { secretKeyRef: { name: sidequest-secrets, key: ES_PASSWORD } }
          resources:
            requests: { cpu: 500m, memory: 1536Mi }
            limits: { memory: 2Gi }
          readinessProbe:
            tcpSocket: { port: 9200 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
spec:
  selector: { app: elasticsearch }
  ports: [{ port: 9200, targetPort: 9200 }]
