apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidequest-api
  labels: { app: sidequest-api }
spec:
  replicas: 1
  selector: { matchLabels: { app: sidequest-api } }
  template:
    metadata: { labels: { app: sidequest-api } }
    spec:
      initContainers:
        - name: index
          image: sidequest-api:dev
          command: ["python", "-m", "sidequest.search", "index"]
          envFrom: [{ secretRef: { name: sidequest-secrets } }]
          env:
            - { name: ES_URL, value: http://elasticsearch:9200 }
      containers:
        - name: api
          image: sidequest-api:dev
          ports: [{ containerPort: 8080, name: http }]
          envFrom: [{ secretRef: { name: sidequest-secrets } }]
          env:
            - { name: ES_URL, value: http://elasticsearch:9200 }
            - { name: OTEL_SERVICE_NAME, value: sidequest-api }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "deployment.environment=hackathon,service.namespace=sidequest" }
            # The phone agent runs on the laptop next to the phone; from inside the cluster that is the Docker host.
            - { name: ARTEMIS_MCP_URL, value: "http://host.docker.internal:8012/mcp" }
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 1536Mi }
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 20, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata:
  name: sidequest-api
spec:
  type: NodePort
  selector: { app: sidequest-api }
  ports: [{ port: 8080, targetPort: 8080, nodePort: 30080 }]
